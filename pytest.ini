[pytest]
# Dossier contenant les tests
testpaths = tests

# Markers personnalisés
# @pytest.mark.slow  → tests qui chargent un modèle ML (lents)
# @pytest.mark.fast  → tests purs sans dépendance externe (rapides)
markers =
    slow: tests qui chargent des modèles ML (déselectionner avec -m "not slow")
    fast: tests unitaires purs sans modèle

# Affichage : -v = verbose, -s = affiche les print()
addopts = -v
